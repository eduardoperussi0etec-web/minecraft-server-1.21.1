name: Minecraft 1.21.1 NeoForge Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Baixar NeoForge 1.21.1
        run: |
          wget -O neoforge-installer.jar \
          https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.231/neoforge-21.1.231-installer.jar

      - name: Instalar NeoForge
        run: |
          mkdir server
          cd server
          java -jar ../neoforge-installer.jar --installServer

      - name: Aceitar EULA
        working-directory: server
        run: |
          echo "eula=true" > eula.txt

      - name: Copiar mods
        run: |
          mkdir -p server/mods
          cp mods/*.jar server/mods/ 2>/dev/null || true

      - name: Iniciar servidor
        working-directory: server
        run: |
          chmod +x run.sh
          ./run.sh
